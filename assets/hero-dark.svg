<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 300" width="1050" height="300" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Bahrul Ulumul Haq (Reinvy) — mobile and backend engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1050" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07060C"/>
      <stop offset="0.55" stop-color="#0B0815"/>
      <stop offset="1" stop-color="#130A21"/>
    </linearGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A960F7" stop-opacity=".34"/>
      <stop offset="1" stop-color="#A960F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A960F7"/>
      <stop offset=".55" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1050" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A960F7" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#F472B6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity=".6"/>
    </linearGradient>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35" fill="none" stroke="#A960F7" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1050" height="300" rx="18"/>
    </clipPath>
    <style>
      .glow-a{animation:driftA 16s ease-in-out infinite}
      .glow-b{animation:driftB 21s ease-in-out infinite}
      .scan{animation:scan 9s linear infinite}
      .caret{animation:blink 1.1s steps(1,end) infinite}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,12px)}}
      @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-10px)}}
      @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(300px)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      @media (prefers-reduced-motion: reduce){.glow-a,.glow-b,.scan,.caret,.pulse{animation:none}}
      .name{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:700}
      .mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace}
      .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1050" height="300" fill="url(#bg)"/>
    <rect width="1050" height="300" fill="url(#grid)"/>
    <g class="glow-a"><circle cx="905" cy="52" r="230" fill="url(#violet)"/></g>
    <g class="glow-b"><circle cx="120" cy="300" r="215" fill="url(#cyan)"/></g>
    <rect class="scan" y="0" width="1050" height="1" fill="url(#edge)" opacity=".35"/>
  </g>

  <rect x="0.5" y="0.5" width="1049" height="299" rx="18" fill="none" stroke="url(#edge)" stroke-opacity=".55"/>

  <g fill="none" stroke="#A960F7" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round">
    <path d="M26 50V32h18"/>
    <path d="M1024 50V32h-18"/>
    <path d="M26 250v18h18"/>
    <path d="M1024 250v18h-18"/>
  </g>

  <text x="56" y="66" class="mono" font-size="11" letter-spacing="3" fill="#A960F7">REINVY // PROFILE</text>
  <text x="54" y="132" class="name" font-size="52" letter-spacing="-.5" fill="#F4EEFF">Bahrul Ulumul Haq</text>
  <rect x="56" y="150" width="168" height="4" rx="2" fill="url(#bar)"/>

  <text x="56" y="186" class="mono" font-size="13" letter-spacing="2.5" fill="#C79BFF">REINVY</text>
  <text x="132" y="186" class="mono" font-size="12" letter-spacing="1.5" fill="#9E90B8">// MOBILE · BACKEND · SYSTEMS</text>

  <text x="56" y="226" class="sans" font-size="15.5" fill="#D7CBE9">I build things that survive the demo: mobile apps, double-entry ledgers,</text>
  <text x="56" y="250" class="sans" font-size="15.5" fill="#D7CBE9">and the developer tooling in between.</text>

  <circle class="pulse" cx="61" cy="278" r="4" fill="#34D399"/>
  <text x="74" y="282" class="mono" font-size="10.5" letter-spacing="1.6" fill="#7FE3B4">OPEN TO OPEN-SOURCE COLLABORATION</text>
  <text x="342" y="282" class="mono" font-size="10.5" fill="#6F6586">/</text>
  <text x="356" y="282" class="mono" font-size="10.5" letter-spacing="1.4" fill="#8E82A6">INDONESIA · UTC+7</text>

  <g>
    <rect x="740" y="48" width="266" height="207" rx="14" fill="#0A0713" stroke="#A960F7" stroke-opacity=".26"/>
    <circle cx="762" cy="68" r="3.5" fill="#FF5F57"/>
    <circle cx="776" cy="68" r="3.5" fill="#FEBC2E"/>
    <circle cx="790" cy="68" r="3.5" fill="#28C840"/>
    <text x="1000" y="72" text-anchor="end" class="mono" font-size="9.5" fill="#6F6586">reinvy@github</text>
    <path d="M740 84h266" stroke="#A960F7" stroke-opacity=".12"/>
    <g class="mono" font-size="11.5">
      <text x="758" y="108" fill="#5EEAD4">$ whoami</text>
      <text x="758" y="130" fill="#E9E2F7">bahrul ulumul haq</text>
      <text x="758" y="152" fill="#5EEAD4">$ cat focus.txt</text>
      <text x="758" y="174" fill="#B9AECF">mobile + backend + oss</text>
      <text x="758" y="196" fill="#5EEAD4">$ npx rakitin</text>
      <text x="758" y="218" fill="#34D399">&gt; ready. nothing rewritten.</text>
    </g>
    <text x="758" y="240" class="mono" font-size="11.5" fill="#A960F7">$</text>
    <rect class="caret" x="772" y="229" width="7" height="13" rx="1" fill="#A960F7"/>
  </g>
</svg>
